
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ScamCheck</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 50px;
        }
        form {
            max-width: 300px;
            margin: auto;
        }
        input[type="text"] {
            width: calc(100% - 20px);
            padding: 10px;
            margin-bottom: 10px;
        }
        button {
            width: 100%;
            padding: 10px;
            background-color: #4CAF50;
            color: white;
            border: none;
            cursor: pointer;
        }
        button:hover {
            background-color: #45a049;
        }
    </style>
</head>
<body>

    <h1>ScamCheck</h1>
    <form id="scamForm">
        <input type="text" id="urlInput" placeholder="Enter URL to check" required>
        <button type="submit">Check for Scams</button>
    </form>

    <div id="result"></div>

    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script>
        $(document).ready(function() {
            $('#scamForm').on('submit', function(event) {
                event.preventDefault();
                const url = $('#urlInput').val();

                $.ajax({
                    url: '/check',
                    method: 'POST',
                    data: { url: url },
                    success: function(response) {
                        $('#result').html(`Scam Check Result: ${response.scamStatus}`);
                    },
                    error: function(error) {
                        $('#result').html('Error checking URL');
                    }
                });
            });
        });
    </script>

</body>
</html>
